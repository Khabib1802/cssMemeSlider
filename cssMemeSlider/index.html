<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
  <link rel="stylesheet" href="src/css/normalize.css">
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="icon" type="image/png" href="src/img/favicon-96x96.png" sizes="96x96" />
  <title>CSS Meme Slider</title>
</head>

<body>
  <div class="slider">

    <input type="radio" name="slider" id="slide1" checked>
    <input type="radio" name="slider" id="slide2">
    <input type="radio" name="slider" id="slide3">
    <input type="radio" name="slider" id="slide4">
    <input type="radio" name="slider" id="slide5">

    <div class="slider-window">
      <div class="slides">
        <div class="slide"><img src="src/img/1.png" alt="Meme-1" width="500" height="500"></div>
        <div class="slide"><img src="src/img/2.png" alt="Meme-2" width="500" height="500"></div>
        <div class="slide"><img src="src/img/3.png" alt="Meme-3" width="500" height="500"></div>
        <div class="slide"><img src="src/img/4.jpg" alt="Meme-4" width="500" height="500"></div>
        <div class="slide"><img src="src/img/5.jpg" alt="Meme-5" width="500" height="500"></div>
      </div>
    </div>

    <div class="description-window">
      <div class="descriptions">
        <p>Программисты и математики</p>
        <p>Плохо написанная функция</p>
        <p>Мой GitHub</p>
        <p>Claude Code</p>
        <p>Пчела на LinkedIn</p>
      </div>
    </div>

    <div class="controls">
      <label for="slide1" class="control-btn"><span class="dot"></span></label>
      <label for="slide2" class="control-btn"><span class="dot"></span></label>
      <label for="slide3" class="control-btn"><span class="dot"></span></label>
      <label for="slide4" class="control-btn"><span class="dot"></span></label>
      <label for="slide5" class="control-btn"><span class="dot"></span></label>
    </div>
  </div>
</body>

</html>
