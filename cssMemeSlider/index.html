<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
  <link rel="stylesheet" href="src/css/normalize.css">
  <link rel="stylesheet" href="src/css/style.css">
  <title>CSS Meme Slider</title>
</head>

<body>
  <div class="slider">

    <input type="radio" name="slider" id="slide1" checked>
    <input type="radio" name="slider" id="slide2">
    <input type="radio" name="slider" id="slide3">
    <input type="radio" name="slider" id="slide4">
    <input type="radio" name="slider" id="slide5">

    <div class="slides">
      <div class="slide"><img src="src/img/1.jpg" alt="Meme-1" width="500" height="400"></div>
      <div class="slide"><img src="src/img/2.jpg" alt="Meme-2" width="500" height="400"></div>
      <div class="slide"><img src="src/img/3.jpg" alt="Meme-3" width="500" height="400"></div>
      <div class="slide"><img src="src/img/4.jpg" alt="Meme-4" width="500" height="400"></div>
      <div class="slide"><img src="src/img/5.jpg" alt="Meme-5" width="500" height="400"></div>
    </div>

    <div class="descriptions">
      <p>Description for Meme-1</p>
      <p>Description for Meme-2</p>
      <p>Description for Meme-3</p>
      <p>Description for Meme-4</p>
      <p>Description for Meme-5</p>
    </div>

    <div class="controls">
      <label for="slide1" class="control-btn"><span class="dot"></span></label>
      <label for="slide2" class="control-btn"><span class="dot"></span></label>
      <label for="slide3" class="control-btn"><span class="dot"></span></label>
      <label for="slide4" class="control-btn"><span class="dot"></span></label>
      <label for="slide5" class="control-btn"><span class="dot"></span></label>
    </div>
  </div>
</body>

</html>
