<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Meme Slider</title>
</head>

<body>
  <div class="slider">

    <input type="radio" name="slider" id="slide1" checked>
    <input type="radio" name="slider" id="slide2">
    <input type="radio" name="slider" id="slide3">
    <input type="radio" name="slider" id="slide4">
    <input type="radio" name="slider" id="slide5">

    <div class="slides">
      <div class="slide"><img src="src/img/1.jpg" alt="Meme-1"></div>
      <div class="slide"><img src="src/img/2.jpg" alt="Meme-2"></div>
      <div class="slide"><img src="src/img/3.jpg" alt="Meme-3"></div>
      <div class="slide"><img src="src/img/4.jpg" alt="Meme-4"></div>
      <div class="slide"><img src="src/img/5.jpg" alt="Meme-5"></div>
    </div>

    <div class="descriptions">
      <p>Description for Meme-1</p>
      <p>Description for Meme-2</p>
      <p>Description for Meme-3</p>
      <p>Description for Meme-4</p>
      <p>Description for Meme-5</p>
    </div>

    <div class="controls">
      <label for="slide1" class="dot"></label>
      <label for="slide2" class="dot"></label>
      <label for="slide3" class="dot"></label>
      <label for="slide4" class="dot"></label>
      <label for="slide5" class="dot"></label>
    </div>
  </div>
</body>

</html>
